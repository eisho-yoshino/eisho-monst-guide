<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>吉野瑛翔物語 | バトルアリーナ</title><style>
*{box-sizing:border-box}body{margin:0;background:#111827;color:#f8fafc;font-family:system-ui,sans-serif}header,.wrap{max-width:760px;margin:auto;padding:15px}a{color:#fde68a}h1{font-size:clamp(24px,5vw,38px);margin:8px 0}.sub{color:#cbd5e1}#game{display:block;width:100%;touch-action:none;background:#182a42;border:2px solid #64748b;border-radius:18px;cursor:crosshair}.panel{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin:12px 0}.chip{background:#28374f;padding:10px 14px;border-radius:12px}button{border:0;border-radius:12px;background:#fbbf24;color:#111827;font-weight:800;padding:12px 18px;cursor:pointer}select{padding:10px;border-radius:10px;background:#253854;color:white;border:1px solid #94a3b8}.tip{line-height:1.65;color:#cbd5e1}#msg{min-height:25px;color:#fcd34d;font-weight:bold}footer{margin-top:20px;color:#94a3b8;font-size:12px}</style></head><body><header><a href="./index.html#home">← 攻略サイトに戻る</a><h1>⚡ ストーリー・ストライク</h1><div class="sub">引っ張って、弾いて、敵を倒そう！ オリジナルの弾くアクションバトル</div></header><main class="wrap"><div class="panel"><div class="chip">ステージ <b id="stage">1</b>/3</div><div class="chip">敵の残り <b id="remaining">3</b></div><div class="chip">ショット <b id="shots">0</b></div></div><div class="panel"><label>使用キャラ <select id="hero"></select></label><button id="restart">最初から</button></div><canvas id="game" width="680" height="820" aria-label="ドラッグしてショットするバトルゲーム"></canvas><p id="msg" role="status">キャラを引っ張って離すとショット！</p><p class="tip">操作：画面下の光るキャラをタッチ／クリックして後ろに引っ張り、離すと反対方向へ飛ぶ。壁で跳ね返って敵に当てよう。敵をすべて倒すと次のステージへ進むよ。キーボードは←→で角度、スペースで発射。</p><footer>※非公式のオリジナル作品です。ゲーム内能力・敵は架空の設定です。</footer></main><script src="characters.js"></script><script src="battle.js"></script></body></html>
